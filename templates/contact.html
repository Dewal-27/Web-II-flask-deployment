<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
</head>
<body>
    <h1>Contact Us</h1>
    <p>contact us at:</p>
    <p>
        {% for key,value in details.items() %}
        <h3>{{key}}</h3>
        <label>Email:</label>{{value.email}}<br>
        <label>Phone:</label>{{value.phone}}<br>
        {% endfor %}
    </p>
    
</body>
</html>
